<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MentorshipMatch connects high school and college students with professionals in their fields of interest.">
  <title>MentorshipMatch — Student-to-Professional Mentorship</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f5c4a'/><path d='M8 22V10l8 7 8-7v12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='25' cy='7' r='3.5' fill='%23c8531f'/></svg>">
  <!-- Applies saved display settings before the page paints (no flash) -->
  <script src="/prefs.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" aria-label="MentorshipMatch home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 22V10l8 7 8-7v12"/><circle cx="25" cy="7" r="3.5"/></svg>
        <span>MentorshipMatch</span>
      </a>
      <div class="header-right">
        <nav id="primaryNav" class="primary-nav" aria-label="Primary"></nav>
        <button class="settings-btn" id="settingsBtn" aria-haspopup="dialog" aria-controls="settingsDrawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="sr-only" data-i18n="settings">Settings</span>
        </button>
        <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav">
          <span class="sr-only">Menu</span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- General pop-up (requests, reviews, reports, résumés) -->
  <dialog id="modal" aria-labelledby="modalTitle">
    <form method="dialog" class="modal-close-form"><button class="icon-btn" aria-label="Close dialog">&times;</button></form>
    <div id="modalBody"></div>
  </dialog>

  <!-- Settings drawer (filled in by settings.js) -->
  <dialog id="settingsDrawer" class="drawer" aria-labelledby="settingsTitle"></dialog>

  <!-- Scribbler assistant (filled in by scribbler.js) -->
  <div id="scribbler"></div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p data-i18n="footer">&copy; 2026 MentorshipMatch — a nonprofit initiative connecting students with professionals.</p>
      <p><a href="#/guidelines" data-i18n="guidelines">Community Guidelines</a> · <a href="#/about" data-i18n="aboutCredits">About &amp; Credits</a></p>
    </div>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script src="/settings.js"></script>
  <script src="/scribbler.js"></script>
</body>
</html>
